# Local dev (§A3, §F2). The server service is owned by the backend; the client proxies
# /api, /ws and /clips to it at http://server:8000.
services:
  client:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_TARGET: http://server:8000
      CONTENT_DIR: /content
      VITE_DEV_MODE: "1"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
      - ./content:/content:ro

volumes:
  client_node_modules:
